{% extends "base.html" %}
{% block title %}Смена пароля — AGIT tool and components track{% endblock %}
{% block content %}
<div class="max-w-sm bg-white border border-slate-200 rounded-xl shadow-sm p-8">
  <h1 class="text-xl font-semibold mb-6">Смена пароля</h1>
  <form method="post" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Текущий пароль</label>
      <input type="password" name="current_password" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Новый пароль</label>
      <input type="password" name="new_password" required minlength="8" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
    </div>
    <button type="submit" class="w-full bg-slate-900 text-white rounded-lg py-2.5 text-sm font-medium hover:bg-slate-800">Сохранить</button>
  </form>
</div>
{% endblock %}
