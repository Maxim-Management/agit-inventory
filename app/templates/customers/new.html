{% extends "base.html" %}
{% block title %}Новый заказчик — AGIT tool and components track{% endblock %}
{% block content %}
<a href="{{ url_for('customers.list_view') }}" class="text-sm text-blue-700 hover:underline">&larr; К списку заказчиков</a>
<h1 class="text-2xl font-semibold mb-6 mt-2">Новый заказчик</h1>
<form method="post" class="bg-white border border-slate-200 rounded-xl p-6 max-w-xl space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div>
    <label class="block text-sm font-medium text-slate-700 mb-1">Название заказчика *</label>
    <input name="name" required value="{{ form.name or '' }}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
  </div>
  <div>
    <label class="block text-sm font-medium text-slate-700 mb-1">Номер договора</label>
    <input name="contract_number" value="{{ form.contract_number or '' }}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
  </div>
  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Стоимость работы, ₽/ч</label>
      <input name="work_rate_rub_per_hour" type="number" step="0.01" value="{{ form.work_rate_rub_per_hour or 0 }}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Стоимость ожидания, ₽/сутки</label>
      <input name="standby_rate_rub_per_day" type="number" step="0.01" value="{{ form.standby_rate_rub_per_day or 0 }}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
    </div>
  </div>
  <p class="text-xs text-slate-400">Эти ставки будут подтягиваться автоматически при внесении выручки по инструменту с выбором этого заказчика.</p>
  <div>
    <label class="block text-sm font-medium text-slate-700 mb-1">Примечание</label>
    <input name="note" value="{{ form.note or '' }}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
  </div>
  <button class="bg-slate-900 text-white rounded-lg px-5 py-2.5 text-sm font-medium hover:bg-slate-800">Сохранить</button>
</form>
{% endblock %}
